version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    forbidigo:
      # Never panic, anywhere: see AGENT_RULES.md in helix-bedrock/.github.
      forbid:
        - pattern: ^panic$
          msg: never panic; return an error instead
        - pattern: ^log\.Fatal.*$
          msg: never exit the process; return an error instead
        - pattern: ^os\.Exit$
          msg: never exit the process; return an error instead
    gosec:
      excludes:
        - G115 # integer conversions are everywhere in binary formats; review them instead
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - forbidigo
      # The protocol has thousands of exported IDs and Marshal methods whose
      # meaning is their name; they come from gophertunnel undocumented.
      - linters: [revive]
        text: 'exported: exported (const|method [A-Za-z]+.Marshal|var)'
      # unsafe string/byte conversions are deliberate in the hot decode path.
      - linters: [gosec]
        text: "G103"
      # Sound names such as "...Token..." are not credentials.
      - path: packet/level_sound_event\.go
        linters: [gosec]
        text: "G101"

formatters:
  enable:
    - gofmt
    - goimports
