name: ProtoDef schema

# schema/protocol.json is generated from the Marshal methods by cmd/protodef.
#
# - Pull requests: test the generator, generate the schema, and show how it differs from
#   the base branch.
# - Pushes to main: regenerate it and, if it changed, open (or refresh) a pull request
#   with the new schema. main only takes signed commits through pull requests, so the
#   commit is made through the GitHub API, which signs it, and it is signed off by the
#   bot for the DCO check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEMA: schema/protocol.json
  BRANCH: schema/regenerate

jobs:
  check:
    name: Generate (check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test the generator
        # Checks the schema against the Reader and Writer for every packet.
        run: go test -count=1 ./internal/protodef
      - name: Generate the schema
        # Fails when the generator meets code it cannot turn into ProtoDef.
        run: go run ./cmd/protodef -o "$SCHEMA"
      - name: Summarise the change
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          {
            echo "## ProtoDef schema"
            if git diff --quiet FETCH_HEAD -- "$SCHEMA"; then
              echo "No change to $SCHEMA from $BASE."
            else
              echo "$SCHEMA changes from $BASE with this pull request:"
              echo '```diff'
              git diff FETCH_HEAD -- "$SCHEMA" | head -n 300
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: protocol.json
          path: ${{ env.SCHEMA }}

  update:
    name: Generate and propose
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # One update at a time, so two pushes in a row cannot race on the branch.
    concurrency:
      group: protodef-schema-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test the generator
        # A schema that does not match the Reader and Writer is not proposed.
        run: go test -count=1 ./internal/protodef
      - name: Generate the schema
        run: go run ./cmd/protodef -o "$SCHEMA"
      - uses: actions/upload-artifact@v7
        with:
          name: protocol.json
          path: ${{ env.SCHEMA }}
      - name: Propose it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- "$SCHEMA"; then
            echo "$SCHEMA is up to date."
            exit 0
          fi
          # Point the branch at this commit of main, then commit the schema on top of it.
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" > /dev/null
          fi
          bot="github-actions[bot] <41898729+github-actions[bot]@users.noreply.github.com>"
          body="$(printf 'Generated by cmd/protodef from %s.\n\nSigned-off-by: %s' "$GITHUB_SHA" "$bot")"
          base64 -w0 "$SCHEMA" > "$RUNNER_TEMP/contents.b64"
          jq -n --rawfile contents "$RUNNER_TEMP/contents.b64" \
            --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$GITHUB_SHA" --arg path "$SCHEMA" --arg body "$body" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "chore(schema): regenerate protocol.json", body: $body },
                fileChanges: { additions: [ { path: $path, contents: $contents } ] }
              } }
            }' > "$RUNNER_TEMP/request.json"
          gh api graphql --input "$RUNNER_TEMP/request.json" --jq '.data.createCommitOnBranch.commit.oid'
          if [ -z "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "chore(schema): regenerate protocol.json" \
              --body "$SCHEMA regenerated by the ProtoDef schema workflow after changes on main. It is refreshed on every push to main until it is merged."
          fi
